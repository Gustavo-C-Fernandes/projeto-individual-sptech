<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Ninho dos Dragões</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <header>
        <div class="header-left">
            <img class="header-logo" src="imgs/logo-ninho-dos-dragoes-v3.svg" alt="Logo Ninho dos Dragões">
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="conteudo.html">Conteúdo</a></li>
                <li><a href="quiz.html">Quiz</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="#" class="active">Cadastro</a></li>
            </ul>
        </nav>

        <a href="login.html" class="login-link">
            <img src="imgs/icone-perfil-dourado.svg" alt="Perfil" class="header-login">
        </a>
    </header>

    <main>
        <div class="cadastro">
            <h2>Cadastro</h2>

            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome">

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">

            <label for="confirmacaoSenha">Confirmar senha</label>
            <input type="password" id="confirmacaoSenha" placeholder="Digite a senha novamente">

            <div id="msg"></div>

            <button class="botao-cadastrar" onclick="cadastrar()">Cadastrar</button>

            <p class="link-login">Já tem conta? <a href="login.html">Entrar</a></p>
            <span style="color: red;"></span>
        </div>
    </main>

    <script>
       function cadastrar() {
    let nomeUser = nome.value.trim()
    let emailUser = email.value.trim()
    let senhaUser = senha.value.trim()
    let senhaUserConfimada = confirmacaoSenha.value.trim()

    msg.innerHTML = ""

    // conta os @, guarda a posição do @ e a do último ponto
    let qtdArroba = 0
    let posArroba = -1
    let posPonto = -1
    for (let i = 0; i < emailUser.length; i++) {
        if (emailUser[i] === "@") {
            qtdArroba++
            posArroba = i
        }
        if (emailUser[i] === ".") {
            posPonto = i
        }
    }

    if (nomeUser === "" || emailUser === "" || senhaUser === "" || senhaUserConfimada === "") {
        msg.innerHTML = "Preencha todos os campos"
    } else if (qtdArroba !== 1) {
        msg.innerHTML = "O e-mail precisa ter um @"
    } else if (posArroba === 0) {
        msg.innerHTML = "Falta algo antes do @"
    } else if (posPonto < posArroba + 2) {
        msg.innerHTML = "Falta o ponto depois do domínio (ex: gmail.com)"
    } else if (posPonto === emailUser.length - 1) {
        msg.innerHTML = "Falta algo depois do ponto"
    } else if (senhaUser !== senhaUserConfimada) {
        msg.innerHTML = "As senhas não coincidem"
    } else {
        // mock: guarda os dados no navegador e vai para o login
        localStorage.setItem("nome", nomeUser)
        localStorage.setItem("email", emailUser)
        localStorage.setItem("senha", senhaUser)
        window.location.href = "login.html"
    }
}
    </script>
</body>

</html>
