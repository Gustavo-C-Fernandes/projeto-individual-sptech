<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ninho dos Dragões</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <header>
        <div class="header-left">
            <img class="header-logo" src="imgs/logo-ninho-dos-dragoes-v3.svg" alt="Logo Ninho dos Dragões">
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="conteudo.html">Conteúdo</a></li>
                <li><a href="quiz.html">Quiz</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>

        <a href="login.html" class="login-link">
            <img src="imgs/icone-perfil-dourado.svg" alt="Perfil" class="header-login">
        </a>
    </header>

    <main>
        <div class="login">
            <h2>Login</h2>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">

            <div id="mensagem"></div>

            <button class="botao-cadastrar" onclick="entrar()">Entrar</button>

            <p class="link-login">Não tem conta? <a href="cadastro.html">Cadastrar</a></p>
        </div>
    </main>
</body>

</html>
<!-- script de alternância de login/sair removido conforme solicitado -->
<script>
    function entrar() {

        let emailUser = email.value.trim()
        let senhaUser = senha.value.trim()

        mensagem.innerHTML = ""



        // mesmo for do cadastro: conta os @ e guarda a posição do @ e do último ponto
        let qtdArroba = 0
        let posArroba = -1
        let posPonto = -1
        for (let i = 0; i < emailUser.length; i++) {
            if (emailUser[i] === "@") {
                qtdArroba++
                posArroba = i
            }
            if (emailUser[i] === ".") {
                posPonto = i
            }
        }

        if (emailUser === "" || senhaUser === "") {
            mensagem.innerHTML = `<span style="color: #FF4d4d;">Preencha todos os campos</span>`
        } else if (qtdArroba !== 1) {
            mensagem.innerHTML = `<span style="color: #FF4d4d;">O e-mail precisa ter um @</span>`
        } else if (posArroba === 0) {
            mensagem.innerHTML = `<span style="color: #FF4d4d;">Falta algo antes do @</span>`
        } else if (posPonto < posArroba + 2) {
            mensagem.innerHTML = `<span style="color: #FF4d4d;">Falta o ponto depois do domínio (ex: gmail.com)</span>`
        } else if (posPonto === emailUser.length - 1) {
            mensagem.innerHTML = `<span style="color: #FF4d4d;">Falta algo depois do ponto</span>`
        } else {
            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    emailServer: emailUser,
                    senhaServer: senhaUser
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (json) {
                        sessionStorage.ID_USUARIO = json.id
                        sessionStorage.NOME_USUARIO = json.nome
                        sessionStorage.EMAIL_USUARIO = json.email
                        window.location.href = "dashboard.html"
                    })
                } else {
                    mensagem.innerHTML = `<span style="color: #FF4d4d;">E-mail e/ou senha inválido(s)</span>`
                }
            }).catch(function (erro) {
                console.log(erro)
            })
        }
    }




</script>
